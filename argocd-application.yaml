apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turing-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/snk189/dgdg.git
    targetRevision: dev
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: turing-test
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      namespace: turing-test
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true