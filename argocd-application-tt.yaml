apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tt-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/snk189/turingtest_gdg_sip.git
    targetRevision: main
    path: k8s-tt
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: tt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
