version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: turing-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass localdevpassword
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turing-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=localdevpassword
      - JWT_SECRET=localdevsecret
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turing-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis_data:
