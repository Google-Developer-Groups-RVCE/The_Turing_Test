apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turing-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/snk189/dgdg.git'
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
      exclude: 'argocd/*'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: turing-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
