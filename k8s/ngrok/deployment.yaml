apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok-tunnel
  namespace: tt
  labels:
    app: ngrok-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok-tunnel
  template:
    metadata:
      labels:
        app: ngrok-tunnel
    spec:
      containers:
      - name: ngrok
        image: ghcr.io/snk189/tt-sip-backend:21ae956ecf39e47f40bf02cb7b9b915e570afb4e
        imagePullPolicy: IfNotPresent
        command: ["ngrok", "http", "http://frontend-service:80", "--authtoken=3CyCiiKsopANXHlXg9l1tmF3OPc_7yw5e9zdseQE4KA69tHMb", "--log=stdout"]
