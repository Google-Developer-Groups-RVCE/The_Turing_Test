apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: turing-test
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/snk189/turing-test-backend:326f4e0723a21cc6c24408e0933fe9d95e26dea5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: turing-config
        - secretRef:
            name: turing-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
