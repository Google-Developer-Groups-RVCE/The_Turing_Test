apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tt
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/rasam729/tt-sip-backend:9bfdc3fe6debe78aa1872d6bb067f1a369bb3ea6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: turing-config
        - secretRef:
            name: turing-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
