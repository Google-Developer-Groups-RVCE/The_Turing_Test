apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: turing-test
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/snk189/turing-test-frontend:a35b47a7fbe06b997529d0a3a447b8fcb843c18f
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
